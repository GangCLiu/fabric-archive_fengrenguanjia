<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小天裁 缝纫管家（JavaScript 版）</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1 class="logo">小天裁缝纫管家</h1>
          <button id="usageHelpTrigger" class="usage-help-trigger" type="button" aria-label="打开使用说明" title="打开使用说明">
            <span class="help-icon">?</span>
            <span>使用说明</span>
          </button>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <h2 id="pageTitle"></h2>
        </header>
        <section id="app" class="app-root" aria-live="polite"></section>
      </main>

      <nav id="bottomNav" class="bottom-nav" aria-label="主导航"></nav>
    </div>

    <template id="fabricCardTpl">
      <article class="card-item">
        <img class="thumb" alt="fabric" />
        <h4 class="title"></h4>
        <p class="line1"></p>
        <p class="line2"></p>
        <div class="row actions"></div>
      </article>
    </template>

    <div id="usageModal" class="usage-modal hidden" role="dialog" aria-modal="true" aria-labelledby="usageModalTitle">
      <div class="usage-modal-card">
        <h3 id="usageModalTitle">使用说明</h3>
        <ol>
          <li>在布料列表点击“去添加布料”</li>
          <li>支持网格/列表视图</li>
          <li>可管理成衣、纸样、尺码档案</li>
          <li>定期在“数据备份”导出 JSON</li>
        </ol>
        <div class="usage-modal-actions">
          <button id="usageModalConfirm" type="button">确定</button>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
